<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixture app</title>
<!--
  A stand-in for the jadm.ai screens the widget runs on: a fixed, see-through
  ("glass") top bar and a fixed sidebar, cards, a chart drawn in SVG, icon
  bubbles whose set changes with the data, a transparent layer over the whole
  window like jadm.ai's, and enough height to scroll. The browser tests pin
  comments on it and measure where the marks land.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f4f4f4; color: #161616; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(8px); border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 24px; padding: 0 24px; z-index: 2; }
  header input { width: 420px; height: 36px; border: 1px solid #c6c6c6; border-radius: 18px; padding: 0 16px; font: inherit; }
  header .badge { margin-left: auto; background: #b45309; color: #fff; border-radius: 10px; padding: 0 8px; }
  aside { position: fixed; top: 56px; left: 0; bottom: 0; width: 240px; background: #fff; border-right: 1px solid #e0e0e0; padding: 16px; }
  aside a { display: block; padding: 8px 12px; color: inherit; text-decoration: none; border-radius: 6px; }
  aside a.on { background: #161616; color: #fff; }
  main { margin: 56px 0 0 240px; padding: 32px; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; min-height: 260px; }
  .wide { grid-column: 1 / -1; }
  button { font: inherit; padding: 10px 18px; border-radius: 20px; border: 0; background: #161616; color: #fff; cursor: pointer; }
  .amount { font-size: 34px; font-weight: 600; }
  .tall { height: 900px; }
  #needs { display: flex; gap: 24px; list-style: none; padding: 0; }
  #needs a { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 140px; color: inherit; text-decoration: none; }
  #needs svg { width: 44px; height: 44px; }
</style>
</head>
<body>
<div id="root">
  <header><b>Fixture</b><input placeholder="Search invoices, customers or references"><span class="badge">3</span></header>
  <aside>
    <a href="#/today">Today</a><a href="#/dashboard" class="on">Dashboard</a><a href="#/analytics" id="nav-analytics">Analytics</a><a href="#/projects">Projects</a>
  </aside>
  <main>
    <section class="card"><h2>Open balance</h2><div class="amount" id="balance">AED 539,400.50</div><button id="new-invoice">New invoice</button></section>
    <section class="card"><h2>Overview</h2>
      <svg id="chart" width="100%" height="220" viewBox="0 0 600 220" preserveAspectRatio="none">
        <rect x="0" y="0" width="600" height="220" fill="#fafafa"/>
        <path d="M0 180 C 100 40, 200 200, 300 120 S 500 20, 600 160" stroke="#161616" stroke-width="3" fill="none"/>
        <circle cx="300" cy="120" r="6" fill="#161616"/>
      </svg>
    </section>
    <section class="card wide"><h2>Needs a person today</h2>
      <ul id="needs">
        <li><a href="#/replies"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#525252"/></svg><span>1 Replies to read</span></a></li>
        <li><a href="#/overdue" id="overdue"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="#525252"/></svg><span>24 Overdue, not on the ladder</span></a></li>
      </ul>
    </section>
    <section class="card wide tall"><h2>Collection health</h2><p id="far-down" style="margin-top:640px">Promises kept 0%</p></section>
  </main>
  <!-- Like jadm.ai: a transparent layer over the whole window, on top of the
       content, that does not move when the page scrolls. -->
  <div id="veil" style="position:fixed;inset:0;z-index:1;background:transparent"></div>
</div>
</body>
</html>
